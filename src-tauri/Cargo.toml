[package]
name = "servix-desktop"
version = "0.1.0"
description = "SERVIX offline-first service management desktop application"
authors = ["Yogesh Gaurav"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "servix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
argon2 = "=0.5.3"
rand = "=0.8.7"
chrono = { version = "=0.4.45", features = ["serde"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
jsonwebtoken = "=9.3.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
urlencoding = "=2.1.3"

[profile.release]
opt-level = 0
lto = false
codegen-units = 256
incremental = false
debug = 0
strip = "symbols"
panic = "abort"

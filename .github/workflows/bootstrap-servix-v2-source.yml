name: Bootstrap SERVIX V2 Source

on:
  push:
    branches:
      - servix-rebuild-v2
    paths:
      - .servix-v2-bootstrap/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: servix-rebuild-v2
          fetch-depth: 0

      - name: Reconstruct fresh SERVIX V2 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem '.servix-v2-bootstrap/part-*' | Sort-Object Name
          if ($parts.Count -ne 4) { throw "Expected 4 SERVIX source parts, found $($parts.Count)" }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'servix-v2-source.tar.gz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($base64))
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '282c53518eb9f277fdebd0f845f3635daf17303260ed6cee9647b9e52af6a689'
          Write-Host "SERVIX source SHA256: $actual"
          if ($actual -ne $expected) { throw "SERVIX source archive checksum mismatch" }
          tar -xzf $archive -C .
          if ($LASTEXITCODE -ne 0) { throw "Could not extract SERVIX V2 source tar.gz" }

          # The permanent V2 build workflow is installed separately through the GitHub connector,
          # because an Actions GITHUB_TOKEN cannot create or update workflow files.
          if (Test-Path '.github/workflows/build-servix-v2.yml') {
            Remove-Item '.github/workflows/build-servix-v2.yml' -Force
          }

          # Remove legacy Python application and temporary transfer material.
          $legacyFiles = @(
            'app.py','attachment_utils.py','database.py','requirements.txt','run_servix.bat',
            'service_report.py','service_repository.py','SERVIX_V2_START.txt'
          )
          foreach ($item in $legacyFiles) { if (Test-Path $item) { Remove-Item $item -Force } }
          foreach ($dir in @('installer','.bootstrap-v2','.bootstrap-v2b','.servix-v2-src','.servix-v2-bootstrap')) {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          }

          if (-not (Test-Path 'package.json')) { throw 'V2 package.json was not extracted' }
          if (-not (Test-Path 'src-tauri/src/commands.rs')) { throw 'V2 Rust command layer was not extracted' }
          if (-not (Test-Path 'src/main.tsx')) { throw 'V2 React shell was not extracted' }
          if (-not (Test-Path 'assets/logo.png')) { throw 'Existing SERVIX app logo was not preserved' }

      - name: Commit normal V2 source files
        shell: pwsh
        run: |
          git config user.name "SERVIX Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Bootstrap fresh SERVIX V2 Tauri React SQLite source"
          git push origin HEAD:servix-rebuild-v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate SERVIX icons
        shell: pwsh
        run: |
          & .\node_modules\.bin\tauri.cmd icon assets/logo.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build first SERVIX V2 Windows installer
        shell: pwsh
        run: |
          & .\node_modules\.bin\tauri.cmd build --config src-tauri/tauri.conf.json --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify single EXE
        shell: pwsh
        run: |
          $files = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File -ErrorAction SilentlyContinue)
          if ($files.Count -ne 1) { throw "Expected exactly one SERVIX EXE, found $($files.Count)" }
          $files | ForEach-Object { Write-Host "Created: $($_.FullName) ($($_.Length) bytes)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SERVIX-V2-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

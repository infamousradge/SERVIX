name: Build SERVIX V2 Windows Installer
on:
  push:
    branches: [servix-rebuild-v2]
  workflow_dispatch:
jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install icon preparation dependency
        run: python -m pip install Pillow
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript frontend build
        run: npm run frontend:build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Generate branded icons and Windows NSIS installer
        run: npm run desktop:build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SERVIX-V2-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

name: Build SERVIX Windows App

on:
  push:
    branches: [ main, feature/service-workflow-v2 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build SERVIX EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name SERVIX app.py

      - name: Smoke test packaged SERVIX startup
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\\dist\\SERVIX\\SERVIX.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "SERVIX exited during startup smoke test with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Build professional Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer\\SERVIX.iss

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\SERVIX\* -DestinationPath SERVIX-Windows.zip -Force

      - name: Upload SERVIX Setup
        uses: actions/upload-artifact@v4
        with:
          name: SERVIX-Setup
          path: installer-output/SERVIX-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: SERVIX-Windows
          path: SERVIX-Windows.zip
          if-no-files-found: error
          retention-days: 30
